[project]
name = "trbot"
version = "0.1.0"
description = "tr-bot-v2: paper-only algorithmic trading framework (free-tier deployable)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "pandas>=2.2,<3",
    "numpy>=1.26,<3",
    "scipy>=1.11,<2",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.2,<3",
    "pyyaml>=6,<7",
    "pyarrow>=16,<22",
    "matplotlib>=3.8,<4",
    "rich>=13,<15",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "pytest-cov>=5,<8",
    "ruff>=0.4",
    "yfinance>=1.0",
]

[project.scripts]
trbot = "trbot.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/trbot"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "S", "I"]
ignore = ["S101"]  # assert use in tests is fine; audited per-file below

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S107"]
# S105: env var NAMES (not passwords); S310: urlopen on code-level allowlisted https hosts
"src/trbot/config.py" = ["S105"]
"src/trbot/data/providers.py" = ["S310"]
"src/trbot/state_turso.py" = ["S310"]
"src/trbot/execution/alpaca_paper.py" = ["S310"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv]
default-groups = []
